include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Scratch/repro files — not part of the app or test suite (see scratch/README.md).
    - scratch/**
    # Dev-only preview tooling — gated behind kDebugMode in app_router.dart, never
    # mounts in a release build. Mounts live feature screens with runtime args, so
    # it is not const-analyzable; excluded from the product gate the same way as
    # scratch/** (not shipped product).
    - lib/dev/**
    # Appwrite server Functions are standalone Dart packages with their own
    # pubspec + analysis_options (verified via `dart analyze` in-package).
    - functions/**
  plugins:
    - custom_lint
  errors:
    missing_required_param: error
    missing_return: error
    unawaited_futures: error
    always_declare_return_types: error
    parameter_assignments: error
    avoid_positional_boolean_parameters: error
    # H.8: enabled repo-wide but held at `info` (non-blocking) while the
    # pre-existing backlog is triaged, so they never break the analyze gate
    # mid-migration. Promote to `warning`/`error` once the backlog is zero.
    discarded_futures: info
    avoid_void_async: info
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true

linter:
  rules:
    # Immutability — FRP & DOP Core
    prefer_final_locals: true
    prefer_final_fields: true
    avoid_returning_this: true
    parameter_assignments: true

    
    # DOP & SRP — API Design
    avoid_positional_boolean_parameters: true
    
    # Performance — catch rebuild-heavy patterns at analysis time
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true

    # Quality — consistent, readable Dart
    always_declare_return_types: true
    avoid_print: true
    prefer_single_quotes: true
    unnecessary_null_checks: true
    use_super_parameters: true
    combinators_ordering: true
    # domain-restructure 3.2.0 — absolute imports make a folder move a single
    # path find-replace instead of a two-directional relative-edge rewrite.
    always_use_package_imports: true
    
    # Safety — resource leak detection
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true

    # H.8 — async & type-safety hardening (targets the sync-bug classes the
    # 2026-07-05 audit found: fire-and-forget futures, blind dynamic casts,
    # catch-all clauses that swallow typed failures, non-Error throws).
    discarded_futures: true
    avoid_void_async: true
    avoid_slow_async_io: true
    avoid_dynamic_calls: true
    cast_nullable_to_non_nullable: true
    avoid_catches_without_on_clauses: true
    only_throw_errors: true
    unnecessary_statements: true
    
    # Style — The MTS Way
    lines_longer_than_80_chars: false # We prefer readable code over strict LOC limits
    curly_braces_in_flow_control_structures: true
    require_trailing_commas: true
