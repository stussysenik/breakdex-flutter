branches: [main]
tagFormat: v${version}
plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  - "@semantic-release/changelog"
  - - "semantic-release-pub"
    - cli: flutter
      publishPub: false
      updateBuildNumber: true
  - - "@semantic-release/exec"
    - prepareCmd: "node scripts/update_release_metadata.cjs ${nextRelease.version} ${nextRelease.gitTag}"
  - - "@semantic-release/git"
    - assets:
        [
          "CHANGELOG.md",
          "README.md",
          "progress.md",
          "docs/hyperdata-ledger.md",
          "pubspec.yaml",
          "package.json",
          "package-lock.json",
        ]
      message: "chore(release): ${nextRelease.version} [skip ci]"
  - "@semantic-release/github"
