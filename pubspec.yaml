name: breakdex
description: "Breakdancing training app — catalog moves, build combos, master through spaced repetition."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  go_router: ^14.8.1
  video_player: ^2.9.3
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  video_thumbnail: ^0.5.3
  # ffmpeg_kit_flutter_new: ^4.1.0  # Replaced by native AVFoundation export
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^10.1.4
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0
  sensors_plus: ^6.1.1
  fsrs: ^2.0.1
  flutter_launch_arguments: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/textures/grain.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
