name: breakdex
description: "Breakdancing training app — catalog moves, build combos, master through spaced repetition."
publish_to: 'none'
version: 1.12.0+15

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  # Pinned so the (freshly-resolved) widget-preview scaffold inherits the same
  # sqlite3 as the app, keeping web/sqlite3.wasm ABI-matched. Bump in lockstep
  # with web/sqlite3.wasm (simolus3/sqlite3.dart release sqlite3-<version>).
  sqlite3: 2.9.4
  go_router: ^14.8.1
  video_player: ^2.9.3
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  video_thumbnail: ^0.5.3
  # ffmpeg_kit_flutter_new: ^4.1.0  # Replaced by native AVFoundation export
  shared_preferences: ^2.5.3
  flutter_markdown: ^0.7.6
  flutter_animate: ^4.5.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^10.1.4
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_auth: ^5.1.0
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6
  sensors_plus: ^6.1.1
  fsrs: ^2.0.1
  flutter_launch_arguments: ^1.0.1
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  mix: ^2.0.3
  cached_query_flutter: ^3.0.3
  flutter_bloc: ^9.1.1
  appwrite: ^25.2.0
  flutter_web_auth_2: ^5.0.3
  meta: ^1.17.0
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  # Declared, not incidental: `test/flutter_test_config.dart` wires
  # `FlutterError.demangleStackTrace` for the whole suite and needs the Trace /
  # Chain types by name. Version matches what the SDK already resolves.
  stack_trace: ^1.12.1
  drift_dev: ^2.22.1
  build_runner: ^2.15.0
  freezed: ^3.2.5
  patrol: ^4.6.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/textures/grain.png
    - assets/fixtures-blue-beat.mp4
    - assets/fixtures-red-beat.mp4
    - assets/fixtures-green-beat.mp4
    # sqlite3 WASM for the widget-preview harness only (Drift-on-web, in-memory).
    # Loaded via rootBundle in lib/dev/preview_db_web.dart. ABI-matched to the
    # pinned `sqlite3` version above; bump both together.
    - assets/sqlite3.wasm

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700

patrol:
  app_name: "Breakdex"
  android:
    package_name: "com.breakdex.breakdex"
  ios:
    bundle_id: "com.breakdex.breakdex"
