name: breakdex
description: "Breakdancing training app — catalog moves, build combos, master through spaced repetition."
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  go_router: ^14.8.1
  video_player: ^2.9.3
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  video_thumbnail: ^0.5.3
  # ffmpeg_kit_flutter_new: ^4.1.0  # Replaced by native AVFoundation export
  shared_preferences: ^2.5.3
  flutter_markdown: ^0.7.6
  flutter_animate: ^4.5.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^10.1.4
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_auth: ^5.1.0
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6
  sensors_plus: ^6.1.1
  fsrs: ^2.0.1
  flutter_launch_arguments: ^1.0.1
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  mix: ^2.0.3
  cached_query_flutter: ^3.0.3
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.15.0
  sqlite3: ^2.4.6
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/textures/grain.png
    - assets/fixtures-blue-beat.mp4
    - assets/fixtures-red-beat.mp4
    - assets/fixtures-green-beat.mp4

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
