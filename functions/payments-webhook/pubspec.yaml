name: payments_webhook
description: >-
  Appwrite Function (Dart runtime) — Lemon Squeezy payment webhook for Breakdex.
  Verifies the X-Signature HMAC over the raw body, grants a purchase entitlement
  idempotently per order id on order_created, and downgrades it to revoked on
  order_refunded — never deleting user data ("lockout not loss").
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  dart_appwrite: ^25.1.0
  crypto: ^3.0.0

dev_dependencies:
  test: ^1.25.0
