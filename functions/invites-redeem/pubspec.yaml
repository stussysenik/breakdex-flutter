name: invites_redeem
description: >-
  Appwrite Function (Dart runtime) — idempotent invite-code redemption for
  Breakdex's private release. Validates a code, grants the caller the invite's
  entitlement (tier + cohort) under owner-only permissions, and consumes one use;
  a replay by the same user consumes nothing further. Expired/exhausted/invalid
  codes are rejected with typed statuses.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  dart_appwrite: ^25.1.0

dev_dependencies:
  test: ^1.25.0
