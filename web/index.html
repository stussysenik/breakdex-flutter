<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced at build time by the `--base-href` argument to `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Capture your breaking moves, compose them into combos, and drill them with spaced repetition.">

  <!-- Browser chrome colour tracks the app's light/dark theme. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090B10">

  <!-- iOS web-app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Breakdex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Breakdex</title>
  <link rel="manifest" href="manifest.json">

  <!-- Match the app's scaffold background so there is no white flash before
       Flutter paints its first frame (AppColors.lightBg / darkBg). -->
  <style>
    html, body { margin: 0; background-color: #F8FAFC; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #090B10; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
