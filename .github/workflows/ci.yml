name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # docs ledger diffs each chapter's verified..HEAD; needs full history

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'

      - run: flutter pub get

      # Phase 5.1: generated localizations must be committed and current.
      - run: ./scripts/check_l10n.sh

      # Engineering-manual chapters must stay current with the code they document.
      - run: node scripts/docs_ledger_check

      - run: flutter analyze

      # Web release target must keep compiling (1.6 CI half). Guards the
      # dart:io/native-plugin seams — a native-only import leaking past a seam
      # fails the web compile here rather than in a browser. (Browser-driven
      # core-flow smoke + first-load perf sanity are the remaining 1.6 halves.)
      - run: flutter build web
