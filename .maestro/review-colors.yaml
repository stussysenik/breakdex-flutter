# Flow: Review page color consistency & layout verification
# Captures screenshots of the redesigned review UI for visual regression.
#
# Checks:
# - Prescreen: segment control, state cards (New/Learning/Mastery)
# - Active session: tinted pill rating buttons (AGAIN/HARD/GOOD/EASY)
# - 44dp button height (Apple HIG minimum touch target)
#
# Prerequisites: At least one move must exist in the database.
# Tags: review

appId: com.breakdex.breakdex
name: Review Colors & Layout
tags:
  - review

---

# Explicit launch keeps the app foregrounded on this simulator and seeds
# deterministic review content for the flow.
- launchApp:
    arguments:
      maestro: true
      breakdexFixture: review

# ── Prescreen checks ──────────────────────────────────────────────────

# Navigate to Review tab
- tapOn:
    id: "drill-tab"
- assertVisible: "Drill"

# Verify the shared segmented controls render
- assertVisible: "Review"
- assertVisible: "Moves"
- assertVisible: "Combos"
- assertVisible: "New\\n1\\nFirst recall"
- assertVisible: "Learning\\n1\\nShort intervals"
- assertVisible: "Mastery\\n1\\nLong intervals"

# Capture the focused moves pre-screen
- takeScreenshot: .maestro-artifacts/review/review-prescreen

# Switch to combos and capture the alternate pre-screen.
- tapOn: "Combos"
- takeScreenshot: .maestro-artifacts/review/review-combos
- tapOn: "Moves"

# Verify the marker visualization mode renders without breaking layout.
- tapOn:
    id: "settings-gear"
- tapOn: "Marker"
- tapOn:
    id: "drill-tab"
- assertVisible: "New\\n1\\nFirst recall"
- takeScreenshot: .maestro-artifacts/review/review-marker

# Restore the standard blue-accent mode.
- tapOn:
    id: "settings-gear"
- tapOn: "Blue"
- tapOn:
    id: "drill-tab"

# ── Active session checks ─────────────────────────────────────────────

# Start a session with all moves
- tapOn: "New\\n1\\nFirst recall"

# Front face should render before the rating strip.
- assertVisible: "Tap anywhere to reveal the video"
- tapOn: "Tap anywhere to reveal the video"
- extendedWaitUntil:
    visible: "Rate GOOD"
    timeout: 10000

# Assert all 4 rating buttons visible
- assertVisible: "Rate AGAIN"
- assertVisible: "Rate HARD"
- assertVisible: "Rate GOOD"
- assertVisible: "Rate EASY"

# Capture the active review session with rating buttons
- takeScreenshot: .maestro-artifacts/review/review-active-session

# Rate a card and verify advance or completion
- tapOn: "Rate GOOD"

# After rating, capture result state
- runFlow:
    when:
      visible: "Great work!"
    commands:
      - takeScreenshot: .maestro-artifacts/review/review-completed
      - assertVisible: "Review Again"

- runFlow:
    when:
      visible: "Tap anywhere to reveal the video"
    commands:
      - takeScreenshot: .maestro-artifacts/review/review-next-card
      - assertVisible: "Tap anywhere to reveal the video"
