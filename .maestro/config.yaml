# Maestro E2E Test Configuration for Breakdex
# Docs: https://maestro.mobile.dev

appId: com.breakdex.breakdex
name: Breakdex E2E Tests

# ⚠ INERT under Maestro 2.x — kept only to document intent. Like `tags:` below,
# nothing reads this: flows that relied on it were resuming each other's screens
# because `launchApp` attaches to a running app instead of cold-starting it.
# Each flow now opens with its own `- clearState` (task 6.3).
onFlowStart:
  - clearState    # Clear app data before each flow
  - clearKeychain # Clear iOS keychain

# Default timeouts (milliseconds)
# Longer timeouts for video operations which can be slow on CI
initFlow:
  appId: com.breakdex.breakdex

# Tags for selective test runs
# Run subsets: maestro test --include-tags=smoke .maestro/
#
# ⚠ This map is DOCUMENTATION, not configuration. Maestro 2.x resolves
# --include-tags against each flow's own front-matter `tags:` block; nothing
# reads the map below. Adding a flow here does not put it in a tier, and
# omitting one does not keep it out — task 6.3 found two flows running under
# the smoke gate that this map never listed. Keep the two in sync by hand, and
# when they disagree, the per-file block is the truth.
tags:
  # hero-transition.yaml is parked as .yaml.disabled (task 6.3): it drove the
  # Arsenal "Gallery" view-mode toggle, which the visual-first redesign removed
  # outright. Parked rather than rewritten, since the feature — not the
  # selector — is gone. Same precedent as party-shake.yaml.
  # flow-clarity.yaml and verify-fixes.yaml were dropped from `smoke` in 6.3 —
  # both are stale against the visual-first redesign.
  smoke: [navigation.yaml, add-content-reachable.yaml, stats-dashboard.yaml]
  flow: [flow-clarity.yaml, stress-flow-graph.yaml]
  video: [import-and-trim.yaml, video-playback.yaml, export-flow.yaml, video-focus.yaml]
  review: [review-session.yaml, review-colors.yaml, review-combo-session.yaml, review-full-cycle.yaml, deck-session.yaml]
  arsenal: [arsenal-crud.yaml]
  settings: [settings-customization.yaml, settings-export.yaml, settings-color-editor.yaml]
  party: [party-shake.yaml]
  performance: [scroll_performance.yaml, inp-latency.yaml]
  regression: [add-content-reachable.yaml]
  stress: [stress-review-rapid.yaml, stress-arsenal-overload.yaml, stress-nav-chaos.yaml, stress-video-editor.yaml, stress-video-loading.yaml, stress-video-parity.yaml, stress-battle.yaml, stress-settings-spam.yaml, stress-combo-crud.yaml, stress-edge-conditions.yaml, stress-lab-crud.yaml, stress-set-builder.yaml, stress-achievement-garden.yaml, stress-lab-full-tabs.yaml, stress-lab-aura-flow.yaml, stress-lab-calendar.yaml]
