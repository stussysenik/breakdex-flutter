# Flow 4: Combo review session flow
# Seeds deterministic data, enters the combo lane, and starts the learning combo.
#
# Tags: review

appId: com.breakdex.breakdex
name: Review Combo Session Flow
tags:
  - review

---

- launchApp:
    arguments:
      maestro: true
      breakdexFixture: review

- tapOn:
    id: "drill-tab"
- assertVisible: "Drill"
- assertVisible: "Moves"
- assertVisible: "Combos"
- tapOn: "Combos"
- assertVisible: "Combos"
- assertVisible: "Learning\\n1\\nShort intervals"
- tapOn: "Learning\\n1\\nShort intervals"
- assertVisible: "Fixture Combo"
- assertVisible: "Tap anywhere to reveal the video"
- tapOn: "Tap anywhere to reveal the video"
- extendedWaitUntil:
    visible: "Rate GOOD"
    timeout: 10000
- assertVisible: "Rate GOOD"
- assertVisible: "Rate AGAIN"
