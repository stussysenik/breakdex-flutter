# Flow: Stats dashboard verification
# Seeds fixture data, opts the Stats tab in, and verifies it renders.
#
# The Stats tab is NOT in the default nav. Settings carries a "Show Stats Tab"
# toggle and the nav renders 4 tabs until it is on — the old version of this
# flow tapped a `progress-tab` that is never mounted on a fresh install. Since
# config.yaml clears state before every flow, the opt-in has to happen inside
# the flow.
#
# Prerequisites: None (uses seeded fixture data)
# Tags: smoke

appId: com.breakdex.breakdex
name: Stats Dashboard
tags:
  - smoke

---

# Per-flow isolation — see navigation.yaml. This flow depends on it twice over:
# the fixture must seed into an empty database, and the Stats opt-in must start
# from off.
- clearState

- launchApp:
    arguments:
      maestro: true
      breakdexFixture: review

# Cold start after clearState, plus fixture seeding — wait for the first real
# frame before touching the nav (see navigation.yaml).
- extendedWaitUntil:
    visible: "Breakdex"
    timeout: 30000

# -- Opt the Stats tab in --
- tapOn:
    id: "settings-tab"
- assertVisible: "Settings"
# The toggle sits far down a long Settings list, and its label is inert — only
# the switch itself responds — so this scrolls to the control by identifier and
# taps that, not the text beside it (task 6.3).
- scrollUntilVisible:
    element:
      id: "stats-tab-switch"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 60
- tapOn:
    id: "stats-tab-switch"

# -- The tab should now be mounted --
# The nav rebuilds after the toggle; wait for the new item rather than racing it.
- extendedWaitUntil:
    visible:
      id: "stats-tab"
    timeout: 10000
- tapOn:
    id: "stats-tab"
- takeScreenshot: e2e-screenshots/stats-dashboard
