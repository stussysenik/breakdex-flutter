# Flow: Stats dashboard verification
# Seeds fixture data, opts the Stats tab in, and verifies it renders.
#
# The Stats tab is NOT in the default nav. Settings carries a "Show Stats Tab"
# toggle and the nav renders 4 tabs until it is on — the old version of this
# flow tapped a `progress-tab` that is never mounted on a fresh install. Since
# config.yaml clears state before every flow, the opt-in has to happen inside
# the flow.
#
# Prerequisites: None (uses seeded fixture data)
# Tags: smoke

appId: com.breakdex.breakdex
name: Stats Dashboard
tags:
  - smoke

---

- launchApp:
    arguments:
      maestro: true
      breakdexFixture: review

# -- Opt the Stats tab in --
- tapOn:
    id: "settings-tab"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Show Stats Tab"
    direction: DOWN
- tapOn: "Show Stats Tab"

# -- The tab should now be mounted --
- tapOn:
    id: "stats-tab"
- takeScreenshot: e2e-screenshots/stats-dashboard
