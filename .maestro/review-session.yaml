# Flow 2: Review session flow
# Starts a review session, rates a card (always visible), and verifies
# the session completes or advances.
#
# Prerequisites: At least one move must exist in the database.
#   Run import-and-trim.yaml first, or seed the database.
# Tags: review

appId: com.breakdex.breakdex
name: Review Session Flow
tags:
  - review

---

# Explicit launch keeps the app foregrounded on this simulator and seeds
# deterministic review content for the flow.
- launchApp:
    arguments:
      maestro: true
      breakdexFixture: review

# Navigate to Review tab
- tapOn:
    point: "146,809"
- assertVisible: "Review"

# Verify the compact moves lane renders, then start a session.
- assertVisible: "Moves"
- assertVisible: "Combos"
- assertVisible: "New\\n1\\nFirst recall"
- assertVisible: "Learning\\n1\\nShort intervals"
- assertVisible: "Mastery\\n1\\nLong intervals"
- tapOn: "New\\n1\\nFirst recall"

# Rating buttons are always visible (no tap-to-reveal).
# Wait for a rating button to confirm the review card loaded.
- extendedWaitUntil:
    visible: "Rate GOOD\\nGOOD"
    timeout: 10000

# Verify all rating buttons are visible
- assertVisible: "Rate AGAIN\\nAGAIN"
- assertVisible: "Rate HARD\\nHARD"
- assertVisible: "Rate GOOD\\nGOOD"
- assertVisible: "Rate EASY\\nEASY"

# Rate the card as "Good"
- tapOn:
    text: "Rate GOOD\\nGOOD"

# The seeded "New" fixture contains exactly one card, so completion is deterministic.
- assertVisible: "Great work!"
- assertVisible: "Review Again"
