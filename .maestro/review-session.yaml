# Flow 2: Review session flow
# Starts a review session with the seeded fixture, verifies the simplified
# launcher plus two-stage review flow, rates a card, and checks deterministic
# completion.
#
# Prerequisites: None (uses seeded fixture data)
# Tags: review

appId: com.breakdex.breakdex
name: Review Session Flow
tags:
  - review

---

# Explicit launch keeps the app foregrounded on this simulator and seeds
# deterministic review content for the flow.
- launchApp:
    arguments:
      maestro: true
      breakdexFixture: review

# Navigate to Review tab
- tapOn:
    id: "drill-tab"
- assertVisible: "Drill"

# Verify the simplified moves lane renders, then start a session.
- assertVisible: "Moves"
- assertVisible: "Combos"
- assertVisible: "3 cards total"
- assertVisible: "Review all due"
- tapOn: "New\\n1"

# First look should show the video card info and only one path forward.
- assertVisible: "Fixture Swipe"
- assertVisible: "New"
- assertVisible: "Assess"

# Move into assessment, then rate the card.
- tapOn: "Assess"
# Maestro intermittently misses the compact rating labels on iOS even though
# the strip is visible, so use the hierarchy-confirmed center of the GOOD
# button on the iPhone 16 Pro simulator.
- tapOn:
    point: "247,645"

# The seeded "New" fixture contains exactly one card, so completion is deterministic.
- assertVisible: "Great work!"
- assertVisible: "Review Again"
