# Flow: Multi-card review full cycle
# Seeds fixture data, reviews a New card with GOOD, verifies completion,
# then reviews a Learning card with AGAIN and verifies it persists.
#
# Prerequisites: None (uses seeded fixture data)
# Tags: review

appId: com.breakdex.breakdex
name: Review Full Cycle
tags:
  - review

---

- launchApp:
    arguments:
      maestro: true
      breakdexFixture: review

# Navigate to Review tab
- tapOn:
    id: "drill-tab"
- assertVisible: "Drill"

# ── Rate a New card as GOOD ─────────────────────────────────────────

- assertVisible: "New\\n1\\nFirst recall"
- tapOn: "New\\n1\\nFirst recall"

- assertVisible: "Tap anywhere to reveal the video"
- tapOn: "Tap anywhere to reveal the video"
- extendedWaitUntil:
    visible: "Rate GOOD"
    timeout: 10000

- tapOn: "Rate GOOD"

# Single New card → should complete
- assertVisible: "Great work!"
- takeScreenshot: e2e-screenshots/review-new-completed

# Go back to prescreen
- tapOn: "Back to Review"

# ── Rate a Learning card as AGAIN ───────────────────────────────────

- assertVisible: "Learning\\n1\\nShort intervals"
- tapOn: "Learning\\n1\\nShort intervals"

- assertVisible: "Tap anywhere to reveal the video"
- tapOn: "Tap anywhere to reveal the video"
- extendedWaitUntil:
    visible: "Rate AGAIN"
    timeout: 10000

- tapOn: "Rate AGAIN"
- takeScreenshot: e2e-screenshots/review-learning-again

# After AGAIN the session should continue with a fresh front face.
- runFlow:
    when:
      visible: "Tap anywhere to reveal the video"
    commands:
      - takeScreenshot: e2e-screenshots/review-learning-persists

- runFlow:
    when:
      visible: "Great work!"
    commands:
      - takeScreenshot: e2e-screenshots/review-learning-completed
