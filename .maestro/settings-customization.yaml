# Flow: Settings customization workflows
# Navigates to Settings and tests category management and theme switching.
#
# Prerequisites: None
# Tags: settings

appId: com.breakdex.breakdex
name: Settings Customization
tags:
  - settings

---

- launchApp

# Navigate to Settings
- tapOn:
    id: "settings-gear"
- scrollUntilVisible:
    element: "Settings"
    direction: UP
    timeout: 20000
    speed: 80
    waitToSettleTimeoutMs: 300
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element: "Move Semantics"
    direction: DOWN
    timeout: 20000
    speed: 20
    waitToSettleTimeoutMs: 300
    visibilityPercentage: 50
    centerElement: false
- takeScreenshot: e2e-screenshots/settings-main

# ── Category management ─────────────────────────────────────────────

# Add a new category
- runFlow:
    when:
      visible: "Add"
    commands:
      - tapOn: "Add"
      - inputText: "E2E Category"
      - tapOn: "Add"
      - assertVisible: "E2E Category"
      - takeScreenshot: e2e-screenshots/settings-category-added

# ── Theme switching ─────────────────────────────────────────────────

# Switch to Marker theme
- scrollUntilVisible:
    element: "Marker"
    direction: UP
    timeout: 20000
    speed: 20
    waitToSettleTimeoutMs: 300
    visibilityPercentage: 50
    centerElement: true
- runFlow:
    when:
      visible: "Marker"
    commands:
      - tapOn: "Marker"
      - takeScreenshot: e2e-screenshots/settings-marker-theme
      # Revert to Blue
      - tapOn: "Blue"
      - takeScreenshot: e2e-screenshots/settings-blue-theme
