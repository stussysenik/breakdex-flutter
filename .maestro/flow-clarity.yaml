appId: com.breakdex.breakdex
tags:
  - flow
name: "Flow clarity regression"

# Dropped from `smoke` in task 6.3 — see verify-fixes.yaml for why the per-file
# tags block, not config.yaml, decides what the gate runs. This flow drives
# `flow-tab`, which the visual-first redesign removed; it is red by
# construction and belongs to the `flow` tier's own repair, not the smoke gate.

---

- runFlow: subflows/launch-stress.yaml

- tapOn:
    id: "flow-tab"
- assertVisible: "Flow"
- assertVisible: "Whole practice network"
- assertVisible: "Moves are graphable now."
- assertVisible:
    id: "flow-legend-toggle"
- assertVisible:
    id: "flow-recenter"
- assertVisible: "Moves"

- tapOn:
    text: "Focus"
- assertVisible: "One-move inspection"
- assertVisible: "Select a move in Map mode"

- tapOn:
    text: "Zones"
- assertVisible: "Category zones"

- tapOn:
    text: "Map"
- assertVisible: "Whole practice network"
