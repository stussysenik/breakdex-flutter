# Flow: Tab navigation & basic screens
# Verifies every bottom-nav tab renders its screen and that the Breakdex home
# tiles drill down and come back.
#
# Selectors were read off a live API-35 emulator hierarchy (task 6.3), not
# guessed. The pre-redesign 5-tab IA this flow used to encode is gone: the tabs
# are now breakdex / add / review / settings, and Stats is opt-in (see
# stats-dashboard.yaml).
#
# Prerequisites: None (works with empty database)
# Tags: smoke

appId: com.breakdex.breakdex
name: Navigation Flow
tags:
  - smoke

---

# Isolation is per-flow, not global. config.yaml's `onFlowStart: clearState` is
# as inert as its `tags:` map under Maestro 2.x — without this line `launchApp`
# RESUMES whatever screen the previous flow left behind, and this flow passes
# alone while failing in the suite (task 6.3).
- clearState

# `maestro: true` pins the semantics tree up for the whole run. Without it the
# app can be fully rendered while the platform tree is still empty, and every
# selector misses a screen that is plainly on display (task 6.3).
- launchApp:
    arguments:
      maestro: true

# config.yaml clears state before every flow, so this is a cold start: Flutter
# has to boot the engine and open the database before the first frame. A plain
# assertVisible races that and fails on a blank surface — every smoke flow waits
# on the first real frame before it asserts anything.
- extendedWaitUntil:
    visible: "Breakdex"
    timeout: 30000

# -- Breakdex home: the visual-first landing --
- assertVisible: "Breakdex"
- assertVisible: "Moves"
- assertVisible: "Combos"

# -- Drill into Moves and back out --
- tapOn:
    id: "moves-tile"
- assertVisible: "Categories"
- assertVisible: "Uncategorized"
- tapOn:
    id: "moves-back"
- assertVisible: "Breakdex"

# -- Add tab --
# The two entry cards render an emoji above a configurable entity name, and the
# platform tree exposes that as one merged label — so they are addressed by
# identifier, not text (task 6.3).
- tapOn:
    id: "add-tab"
- assertVisible: "Add Content"
- assertVisible:
    id: "add-move-card"
- assertVisible:
    id: "add-combo-card"

# -- Review tab --
- tapOn:
    id: "review-tab"
- assertVisible: "Drill"
- assertVisible: "Deck"
- assertVisible: "MOVES BOXES"

# -- Settings tab --
- tapOn:
    id: "settings-tab"
- assertVisible: "Settings"
# The "PRACTICE & REVIEW" subtitle this used to assert was removed from the
# screen in the same wave as this repair, so asserting it was a guaranteed red.
# Settings' body is covered by stats-dashboard.yaml, which scrolls the list.

# -- Back to home --
- tapOn:
    id: "breakdex-tab"
- assertVisible: "Breakdex"
