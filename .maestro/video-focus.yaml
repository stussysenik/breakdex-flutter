# Flow: Playback focus and pause ownership
# Uses the seeded review fixture with local bundled videos so playback can be
# verified without simulator Photos import.
#
# Checks:
# - Move detail exposes real source/album filenames
# - Playing video pauses when navigating away via bottom-tab switch
# - Opening the video editor pauses the inline player underneath

appId: com.breakdex.breakdex
name: Video Focus Ownership
tags:
  - video
  - verify

---

- launchApp:
    arguments:
      maestro: true
      breakdexFixture: review

- assertVisible: "Arsenal"
- assertVisible: "Fixture Swipe"
- tapOn: "Fixture Swipe"

- extendedWaitUntil:
    visible: "ACTIONS"
    timeout: 10000

- assertVisible: "Source file"
- assertVisible: "Album file"
- assertVisible: "fixture-swipe-blue-beat.mp4"

- tapOn: "Play"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 5000

- tapOn:
    id: "drill-tab"
- assertVisible: "Drill"

- tapOn:
    id: "moves-tab"
- assertVisible: "Fixture Swipe"
- tapOn: "Fixture Swipe"

- extendedWaitUntil:
    visible: "ACTIONS"
    timeout: 10000

- assertVisible: "Play"
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 5000

- tapOn: "Edit Video"
- extendedWaitUntil:
    visible: "Export"
    timeout: 10000

- back
- extendedWaitUntil:
    visible: "ACTIONS"
    timeout: 10000

- assertVisible: "Play"
